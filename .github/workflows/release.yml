name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        arch: [arm64, amd64]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: darwin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tag matches binary version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(go run ./cmd/herdr-process-guard version | awk '{print $2}')"
          test "$actual" = "$expected"
      - name: Test
        run: go test ./...
      - name: Build archive
        env:
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          archive="herdr-process-guard_${GITHUB_REF_NAME#v}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${archive}"
          go build -trimpath -ldflags="-s -w" -o "dist/${archive}/herdr-process-guard" ./cmd/herdr-process-guard
          cp README.md LICENSE herdr-plugin.toml "dist/${archive}/"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          (cd dist && shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already published; preserving its versioned assets."
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
          fi
