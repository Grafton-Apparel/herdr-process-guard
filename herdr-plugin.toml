id = "herdr.process-guard"
name = "Process Guard"
version = "0.2.1"
min_herdr_version = "0.9.5"
description = "Inspect agent workloads and monitor conservative Linux orphan cleanup"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[actions]]
id = "audit"
title = "Process Guard: audit agent leftovers"
description = "Run a read-only audit of workloads attributed to Herdr coding-agent panes."
command = ["./bin/herdr-process-guard", "scan"]

[[startup]]
command = ["./bin/herdr-process-guard", "service-ensure"]

[[events]]
on = "pane.agent_detected"
command = ["./bin/herdr-process-guard", "service-ensure"]

[[events]]
on = "pane.agent_status_changed"
command = ["./bin/herdr-process-guard", "service-ensure"]

[[events]]
on = "pane.exited"
command = ["./bin/herdr-process-guard", "service-ensure"]

[[events]]
on = "pane.closed"
command = ["./bin/herdr-process-guard", "service-ensure"]

[[panes]]
id = "dashboard"
title = "Process Guard"
placement = "popup"
width = "95%"
height = "85%"
command = ["./bin/herdr-process-guard", "dashboard"]

[[actions]]
id = "dashboard"
title = "Process Guard: inspect workloads"
contexts = ["global", "workspace", "pane"]
command = ["./bin/herdr-process-guard", "open-dashboard"]

[[actions]]
id = "watchdog-status"
title = "Process Guard: watchdog status and controls"
contexts = ["global", "workspace", "pane"]
command = ["./bin/herdr-process-guard", "open-watchdog"]

[[actions]]
id = "pause"
title = "Process Guard: pause automatic cleanup"
contexts = ["global", "workspace", "pane"]
command = ["./bin/herdr-process-guard", "pause"]

[[actions]]
id = "resume"
title = "Process Guard: resume automatic cleanup"
contexts = ["global", "workspace", "pane"]
command = ["./bin/herdr-process-guard", "resume"]

[[panes]]
id = "watchdog-status"
title = "Process Guard watchdog"
placement = "popup"
width = "90%"
height = "75%"
command = ["./bin/herdr-process-guard", "watchdog-dashboard"]
